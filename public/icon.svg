<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bookPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.65" />

  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="176" fill="#1E1B4B" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />

  <!-- Sacred Flame / Enlightenment Top Finial -->
  <path d="M256 120 C248 138 240 148 240 160 C240 168 247 174 256 174 C265 174 272 168 272 160 C272 148 264 138 256 120 Z" fill="url(#goldShine)" />
  <circle cx="256" cy="150" r="4" fill="#FFFFFF" />

  <!-- Radiating knowledge rays -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="184" x2="256" y2="198" />
    <line x1="216" y1="190" x2="225" y2="202" />
    <line x1="296" y1="190" x2="287" y2="202" />
    <line x1="186" y1="210" x2="198" y2="220" />
    <line x1="326" y1="210" x2="314" y2="220" />
  </g>

  <!-- Open Wisdom Book (Central symbol) -->
  <g filter="url(#shadow)">
    <!-- Book Spine & Backing -->
    <path d="M256 348 L152 300 C140 294 136 280 142 268 L158 236 C162 228 172 222 182 226 L256 254 L330 226 C340 222 350 228 354 236 L370 268 C376 280 372 294 360 300 Z" fill="#B45309" />

    <!-- Book Left Pages -->
    <path d="M256 338 C216 322 174 316 148 318 C144 318 140 314 140 310 L148 238 C148 234 152 230 156 232 C182 232 224 238 256 256 Z" fill="url(#bookPageGrad)" />
    
    <!-- Book Right Pages -->
    <path d="M256 338 C296 322 338 316 364 318 C368 318 372 314 372 310 L364 238 C364 234 360 230 356 232 C330 232 288 238 256 256 Z" fill="url(#bookPageGrad)" />

    <!-- Page Text Lines (Indicating Scoring & Records) -->
    <line x1="168" y1="258" x2="236" y2="272" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" />
    <line x1="168" y1="274" x2="236" y2="288" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="168" y1="290" x2="224" y2="302" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

    <line x1="344" y1="258" x2="276" y2="272" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" />
    <line x1="344" y1="274" x2="276" y2="288" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="344" y1="290" x2="288" y2="302" stroke="#10B981" stroke-width="4" stroke-linecap="round" />

    <!-- Center Bookmark Ribbon -->
    <path d="M252 254 L260 254 L260 366 L256 360 L252 366 Z" fill="#EF4444" />
  </g>

  <!-- Golden 5-Point Evaluation Star Badge at Bottom -->
  <g transform="translate(256, 376)">
    <circle cx="0" cy="0" r="28" fill="#1E1B4B" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- 5-Point Star -->
    <polygon points="0,-16 4.9,-4.9 16,-4.9 7.4,2.5 10.6,13.8 0,7.2 -10.6,13.8 -7.4,2.5 -16,-4.9 -4.9,-4.9" fill="url(#goldShine)" />
  </g>
</svg>
